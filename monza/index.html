function festa(tipo){

  const rnd=Math.random, natale=tipo==='n', zucche=tipo==='h', DUR=3600, t0=performance.now();
  const alto=(parseFloat(getComputedStyle(document.documentElement).paddingTop)||0), basso=(parseFloat(getComputedStyle(document.documentElement).paddingBottom)||0);

  const COLH=[['#F28C28','#B85512'],['#E8742A','#A64A0C'],['#F5A142','#C26A14'],['#EE8A1E','#B0570E']];   // zucche (Halloween, Davide 24/11/2026): arancio e costole più scure

    x.fillStyle='#3E6B2A';x.beginPath();x.moveTo(-s*.05,-ry+1);x.lineTo(s*.06,-ry-s*.2);x.lineTo(s*.12,-ry-s*.16);x.lineTo(s*.05,-ry+1);x.closePath();x.fill()}

function come(){return `${barra(false)}<section class="pag chi"><h2>Il Termometro</h2>
 <p>Ogni settimana escono decine di titoli su panchine "in bilico" ed esoneri "imminenti", spesso firmati da "insider" che non devono mai rendere conto di quando sbagliano.</p>
 <p>Il Termometro è un progetto indipendente: non lavora per club, procuratori o agenzie di scommesse. Incrocia fattori tarati sugli esoneri delle stagioni precedenti e ne ricava una stima ragionata di quanto è probabile che un allenatore lasci la panchina prima della prossima partita, entro Natale, entro Pasqua o entro fine stagione. Copre Serie A, Serie B, Premier League e Bundesliga.</p>
 <h3>Come funziona</h3>
 <ul>
  <li><b>Fino a cinque orizzonti.</b> Con ⚽ 🎃 🎄 🐣 🏁 scegli fino a quando guardare: la prossima partita, Halloween, Natale, Pasqua o la fine della stagione. Una data già passata sparisce e torna con la stagione dopo. Per le date più lontane simuliamo migliaia di volte il resto del campionato (partite, risultati, classifica) e contiamo in quante di queste simulazioni l'allenatore perde il posto.</li>
  <li><b>Un numero, con un margine.</b> Nella lista c'è la stima. Nella scheda trovi anche un intervallo: la stima ricalcolata più volte su versioni leggermente diverse degli anni passati. Un intervallo ampio vuol dire che la situazione è poco comune e la stima è più incerta del solito.</li>
  <li><b>Motivazioni.</b> Dal menu ☰ trovi, per ogni allenatore, le due o tre ragioni principali della sua stima.</li>
  <li><b>Colore e frecce.</b> Il colore va da freddo a rovente. ▲ e ▼ indicano la variazione rispetto a 24 ore prima (solo per la prossima partita).</li>
  <li><b>La scheda.</b> Toccando un allenatore si apre la sua scheda: data e avversario della prossima partita e, in "Movimenti", ogni partita e notizia con la probabilità subito dopo.</li>
  <li><b>L'andamento.</b> Con "Mostra andamento" si vede come è cambiata la probabilità nel tempo.</li>
  <li><b>Il tempo.</b> Senza novità la probabilità scende man mano che passano i giorni: la maggior parte degli esoneri arriva nei giorni subito dopo una partita.</li>
  <li><b>Il giorno della partita.</b> Al posto del numero compare "In campo oggi": prima del fischio d'inizio la probabilità che lasci è quasi nulla.</li>
  <li><b>Allenatore appena nominato.</b> La stima parte dopo la sua prima partita.</li>
 </ul>
 <p style="font-size:13px;color:var(--mut)">Non è un consiglio di scommessa. Il sito non usa cookie.</p></section>
 <footer>Per informazioni, curiosità, segnalazioni o richieste: <a href="mailto:info@termometropanchine.it">info@termometropanchine.it</a></footer>`}

  const rows=A.filter(a=>a.campionato===st.lega).slice().sort((x,y)=>srt==='p'?(y.ufficiale-x.ufficiale)||(V(y)-V(x)):((DV(y)||0)-(DV(x)||0)));
  const ag=new Date(D.aggiornato);
  return `<div class="banda"><header>${st.m==='n'?luci():''}<div class="brand">${menuBtn()}<svg width="22" height="40" viewBox="0 0 22 40" aria-hidden="true"><defs><linearGradient id="tg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF4D4D"/><stop offset=".5" stop-color="#FFC94A"/><stop offset="1" stop-color="#4FC3F7"/></linearGradient></defs><rect x="7" y="2" width="8" height="26" rx="4" fill="none" stroke="#C9D1E3" stroke-width="1.5"/><rect x="9.5" y="9" width="3" height="20" rx="1.5" fill="url(#tg)"/><circle cx="11" cy="32" r="6" fill="#FF4D4D" stroke="#C9D1E3" stroke-width="1.5"/></svg><h1>Termometro Panchine</h1></div><p class="sub">Probabilità che l'allenatore lasci la panchina ${ENTRO[st.m]}</p>
  <p class="agg">Numeri aggiornati a ${ag.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',timeZone:'Europe/Rome'})}, ore ${ag.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Rome'})}.</p></header>
  ${metrica()}
  <section class="sec"><h2 class="lab fire">🔥 Panchine più calde</h2><div class="hot">${hot.map(a=>`<a class="card" style="--h:${heat(a)}" href="${linkSq(a.squadra)}">
   <div style="display:flex;align-items:center;gap:6px">${badge(a.squadra)}<span style="font-size:12px;color:var(--mut)">${esc(a.campionato)}</span></div>
   <span class="nm">${esc(a.allenatore)}</span><span class="pp">${pshow(a)}</span>${chg(DV(a),a)}</a>`).join('')}</div><div class="legenda"><span>fredda</span><i></i><span>rovente</span></div></section>
  <nav class="sec" aria-label="Filtri"><div class="seg">${LEGHE.map(([l,t])=>`<button aria-pressed="${st.lega===l}" data-lega="${l}">${t}</button>`).join('')}</div>
  <div class="sortr" ${st.m==='p'?'':'style="display:none"'}><span style="font-size:12px;color:var(--mut)">Ordina per</span><div><button class="pill" aria-pressed="${st.sort==='p'}" data-sort="p">Rischio</button><button class="pill" aria-pressed="${st.sort==='v'}" data-sort="v">Variazione</button></div></div></nav></div>
  <div class="cols"><span>Allenatore</span><span>Probabilità</span></div>
  <ol>${rows.map(a=>`<li><a class="row" style="--h:${heat(a)}" href="${linkSq(a.squadra)}">${badge(a.squadra)}<div class="who"><span class="nm">${esc(a.allenatore)}${a.interim?'<span class="tag">INTERIM</span>':''}</span><span class="tm">${esc(nm(a.squadra))}</span>${term(a)}</div>
   <div class="nums"><span class="pp">${pshow(a)}</span>${chg(DV(a),a)}</div></a></li>`).join('')}</ol>
  <footer>Il Termometro non ha talpe negli spogliatoi né la sfera di cristallo. Incrocia fattori tarati sugli esoneri delle stagioni precedenti e ne ricava una stima ragionata di quanto è probabile che un allenatore lasci la panchina ${ENTRO[st.m]}. Non è un consiglio di scommessa. ${st.m==='p'?'▲ rischio in aumento · ▼ in calo, rispetto a 24 ore prima.':'Più la data è lontana, più la stima è larga: nella scheda di ogni allenatore c\'è l\'intervallo.'}</footer>`;
}
function grafico(a){
  let s=a.serie; if(!s||s.length<2)return '<p class="sub">Andamento disponibile dopo qualche aggiornamento.</p>';
  const W=320,H=150,k=1; s=s.filter(x=>x[k]!=null); if(s.length<2)return '<p class="sub">Andamento disponibile dopo qualche aggiornamento.</p>'; const t0=Date.parse(s[0][0]),t1=Date.parse(s[s.length-1][0])||t0+1,mx=Math.max(5,...s.map(x=>x[k]))*1.1;
  const X=t=>8+(W-16)*(Date.parse(t)-t0)/Math.max(1,t1-t0),Y=v=>H-10-(H-20)*v/mx;
  const pts=s.map(x=>X(x[0]).toFixed(1)+','+Y(x[k]).toFixed(1)).join(' ');
  const d=t=>new Date(t).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'});
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento della probabilità"><line x1="0" y1="${H-10}" x2="${W}" y2="${H-10}" stroke="#28324D"/>
   <line x1="0" y1="${Y(mx/2)}" x2="${W}" y2="${Y(mx/2)}" stroke="#1E242D" stroke-dasharray="3 4"/><defs><linearGradient id="lg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4FC3F7"/><stop offset=".5" stop-color="#FFC94A"/><stop offset="1" stop-color="#FF4D4D"/></linearGradient><linearGradient id="la" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A3D" stop-opacity=".35"/><stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/></linearGradient></defs>
   <polygon points="${X(s[0][0]).toFixed(1)},${H-10} ${pts} ${X(s[s.length-1][0]).toFixed(1)},${H-10}" fill="url(#la)"/><polyline points="${pts}" fill="none" stroke="url(#lg)" stroke-width="2.5" stroke-linejoin="round"/></svg>
   <div class="ax"><span>${d(s[0][0])}</span><span>max scala ${pct(mx)}</span><span>${d(s[s.length-1][0])}</span></div>`;
}
function quandoPart(sq,q,avv,casa){const d=new Date(q.replace(' ','T'));
  return d.toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit'})+', '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})+(avv?', '+(casa?nm(sq)+'–'+nm(avv):nm(avv)+'–'+nm(sq)):'')}
function extraCoppa(a){if(a.ufficiale||a.debutto_atteso)return '';let x='';
  if(a.campionato_p!=null)x+=`<br>Entro la prossima di campionato${a.campionato_prossima?' ('+esc(quandoPart(a.squadra,a.campionato_prossima,a.campionato_avversario,a.campionato_casa))+')':''}: ${pct(a.campionato_p)}`;
  return x}
function finestra(a){
  if(!a.prossima)return 'Probabilità che lasci la panchina prima della prossima partita.';
  const d=new Date(a.prossima.replace(' ','T'));
  const quando=d.toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit'})+', '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  const part=a.prossima_avversario?', '+(a.prossima_casa?nm(a.squadra)+'–'+nm(a.prossima_avversario):nm(a.prossima_avversario)+'–'+nm(a.squadra)):'';
  if(a.prossima_competizione)return `Probabilità che lasci la panchina prima della prossima partita, in ${esc(a.prossima_competizione)}: ${quando}${esc(part)}.`;
  return `Probabilità che lasci la panchina prima della prossima partita: ${quando}${esc(part)}.`;
}
function incertezza(a){const k=OR[st.m],o=a.orizzonti||{},I=o[k+'_int'];if(!I||o[k]==null)return '';
  const lg=v=>{const p=Math.min(99.5,Math.max(0.5,v))/100;return Math.log(p/(1-p))}, w=x=>lg(x[1])-lg(x[0]),   // ampiezza su scala logit: confrontabile tra rischi alti e bassi
   L=D.allenatori.map(x=>(x.orizzonti||{})[k+'_int']).filter(Boolean).map(w).sort((x,y)=>x-y), med=L[Math.floor(L.length/2)], r=med>0?w(I)/med:1;
  const lo=Math.min(I[0],o[k]), hi=Math.max(I[1],o[k]);   // la stima si aggiorna più spesso dell'intervallo: l'intervallo mostrato la contiene sempre
  const [tit,txt]=r>1.35?['Stima più incerta del solito','L\'intervallo è più ampio di quello degli altri allenatori. Succede quando la situazione della squadra è poco comune nelle stagioni passate (per esempio una crisi molto marcata, un allenatore arrivato da poco, una classifica molto lontana dalle attese): i casi simili su cui basarsi sono pochi, e il numero può spostarsi di più.']
   :r<0.75?['Stima più solida del solito','L\'intervallo è più stretto di quello degli altri allenatori: situazioni come questa sono frequenti nelle stagioni passate, quindi i casi simili su cui basarsi sono tanti.']
   :['Incertezza nella media','L\'intervallo è simile a quello degli altri allenatori: è l\'incertezza normale per una stima a questa distanza di tempo.'];
  return `<section class="sec inc"><h3 class="lab">Quanto è sicura questa stima</h3><p class="it"><b>${tit}.</b> ${pint(lo)===pint(hi)?`Intorno al ${pint(o[k])}.`:`Tra il ${pint(lo)} e il ${pint(hi)}, con stima centrale ${pint(o[k])}.`}</p><p>${txt}</p>
   <p class="nb">L'intervallo misura quanto il modello è sicuro oggi. Partite e notizie dei prossimi giorni sposteranno il numero: si aggiorna dopo ogni partita.</p></section>`}
function scheda(a){
  const ev=(a.eventi||[]).slice().reverse();
  const o=a.orizzonti||{}, I=k=>{const J=o[k+'_int'];if(!J)return '';const lo=pint(Math.min(J[0],o[k])),hi=pint(Math.max(J[1],o[k]));return lo===hi?'':` (tra il ${lo} e il ${hi})`};
  const altro=(a.ufficiale||a.debutto_atteso)?'':[['halloween','🎃 Entro Halloween'],['natale','🎄 Entro Natale'],['pasqua','🐣 Entro Pasqua'],['fine','🏁 Entro fine stagione']].filter(([k])=>o[k]!=null&&k!==OR[st.m]).map(([k,t])=>`${t}: <b>${pint(o[k])}</b>${I(k)}`).join('<br>');
  return `${barra(true)}
  ${metrica()}
  <section class="det" style="--h:${heat(a)}"><div style="display:flex;align-items:center;gap:8px">${badge(a.squadra,true)}<span style="font-size:13px;color:var(--mut)">${esc(nm(a.squadra))} · ${esc(a.campionato)}</span></div>
   <h2>${esc(a.allenatore)}${a.interim?'<span class="tag">INTERIM</span>':''}</h2>
   <div class="big"><span class="pp">${pshow(a)}</span>${chg(DV(a),a)}</div>
   <p class="sub">${a.ufficiale?'Comunicato ufficiale del club.':a.debutto_atteso?'Appena nominato: la stima parte dopo la prima partita.':st.m!=='p'?(V(a)<0?'Per questa data la stima non è disponibile.':'Probabilità che lasci la panchina '+ENTRO[st.m]+'.'):oggi(a)?'Partita di oggi: '+esc(quandoPart(a.squadra,a.prossima,a.prossima_avversario,a.prossima_casa).split(', ').slice(1).join(', '))+'. Il giorno della partita, prima del fischio d\'inizio, la probabilità che lasci è quasi nulla.':finestra(a)}${a.ufficiale||a.debutto_atteso||oggi(a)?'':(st.m!=='p'?(V(a)<0?'':' Si aggiorna dopo ogni partita e con le notizie, tenendo conto di tutte le giornate che restano.'):' Senza novità la probabilità scende man mano che passano i giorni.')}${extraCoppa(a)}</p>${altro?`<p class="sub oriz">${altro}</p>`:''}</section>
  ${st.m!=='p'?incertezza(a):`<section class="box"><label for="g"><input id="g" type="checkbox" ${st.chart?'checked':''}> Mostra andamento</label>${st.chart?grafico(a):''}</section>
  ${!ev.length?'':`<section class="sec" style="--h:${heat(a)}"><h3 class="lab">Movimenti</h3><ol class="ev">${ev.map(e=>`<li style="--h:${HEAT.find(([t])=>e.p<t)[1]}"><div class="c"><b>${esc(nmTesto(e.causa))}</b><span>${e.data.split('-').reverse().slice(0,2).join('/')}</span></div><span class="e">${pct(e.p)}</span></li>`).join('')}</ol></section>`}`}
  <footer>Le notizie sono pesate per affidabilità della fonte. Solo il comunicato ufficiale del club porta la probabilità al 100%.</footer>`;
}
function render(){
  const app=document.getElementById('app'); if(!D)return; if(!attivi().includes(st.m))st.m='p'; if(!LEGHE.some(([l])=>l===st.lega))st.lega='Serie A';
  const h=via();   // indirizzo scritto male: si torna alla lista
  const a0=h?D.allenatori.find(x=>slug(x.squadra)===h):null;   // titolo della scheda del browser come quello della pagina vera della squadra
  document.title=a0?`${a0.allenatore} (${nm(a0.squadra)}): probabilità di esonero – Termometro Panchine`:'Termometro Panchine – probabilità di addio degli allenatori di calcio';
  const a=h?D.allenatori.find(x=>slug(x.squadra)===h):null;
  document.documentElement.dataset.m=(!h||a)?st.m:'p';   // lo sfondo dell'orizzonte vale per la lista e le schede, non per le altre pagine
  app.innerHTML=(h==='cambi'?cambi():h==='come'?come():h==='perche'?perche():a?scheda(a):lista())+drawer(); if(a||h==='cambi'||h==='come'||h==='perche')window.scrollTo(0,0);
}
document.addEventListener('click',e=>{if(e.target.closest('[data-chiudi]')||e.target.closest('.drawer a')){st.menu=false;render();if(!e.target.closest('.drawer a'))return}
  const b=e.target.closest('button');if(!b)return; if(b.dataset.menu){st.menu=true;render();return}
  if(b.dataset.m){const prima=st.m;st.m=b.dataset.m;save();render();if(st.m!==prima){const f=document.getElementById('festa');if(f)f.remove();if(st.m==='n'||st.m==='q'||st.m==='h')festa(st.m)}}   /* cambiando orizzonte l'animazione in corso sparisce subito */ if(b.dataset.lega){st.lega=b.dataset.lega;save();render()} if(b.dataset.sort){st.sort=b.dataset.sort;save();render()}});
document.addEventListener('change',e=>{if(e.target.id==='g'){st.chart=e.target.checked;render()}});
window.addEventListener('hashchange',render); window.addEventListener('popstate',render);
// link interni senza # (squadre, pagina principale): si cambia indirizzo senza ricaricare; se il browser non lo permette, si carica la pagina
document.addEventListener('click',e=>{const l=e.target.closest('a[href]');if(!l||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
  const u=l.href;if(!u.startsWith(RADICE)||u.includes('#'))return;try{history.pushState(null,'',u);e.preventDefault();render()}catch(err){}});
fetch(RADICE+'dati.json?'+Date.now()).then(r=>r.json()).then(j=>{if(!j||!Array.isArray(j.allenatori))throw new Error('dati incompleti');D=j;render()}).catch(()=>{document.getElementById('app').innerHTML='<div class="empty">Dati non disponibili al momento.</div>'});
</script>
